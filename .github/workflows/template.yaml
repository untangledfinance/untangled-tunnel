on:
  workflow_call:
    inputs:
      ENV:
        description: Deployment environment.
        type: string
      REGISTRY:
        description: URL of the container registry.
        required: true
        type: string
      IMAGE_NAME:
        description: Name of the image.
        required: true
        type: string
      VERSION:
        description: Specify the image version.
        type: string
      PUSH_LATEST:
        description: Push the image with 'latest' tag along with the specified version.
        type: boolean

jobs:
  push:
    runs-on: ubuntu-latest
    name: 'Build & Push'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v4
      - name: Build & push image
        run: |
          ENV=${{ inputs.ENV }}
          VERSION=${{ inputs.VERSION }}
          IMAGE_NAME=${{ inputs.REGISTRY }}/${{ inputs.IMAGE_NAME }}
          PUSH_LATEST=${{ inputs.PUSH_LATEST }}
          [ -z $VERSION ] && VERSION=$(date +'%y.%m.%d-%H%M%S')-$(git rev-parse --short "$GITHUB_SHA")
          DOCKERFILE=Dockerfile
          [ -f $ENV.Dockerfile ] && DOCKERFILE=$ENV.Dockerfile
          docker build -f $DOCKERFILE . -t $IMAGE_NAME:$VERSION --build-arg VERSION=$VERSION
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE_NAME:$VERSION
          [ "$PUSH_LATEST" == "true" ] && docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest && docker push $IMAGE_NAME:latest
